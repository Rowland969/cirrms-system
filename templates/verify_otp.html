{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4 text-center" style="max-width: 450px; width: 100%; border-radius: 12px; border: none;">
        <div class="mb-3">
            <i class="bi bi-shield-check text-success" style="font-size: 3rem;"></i>
        </div>
        <h3 class="fw-bold mb-2" style="color: #1b4332;">Confirm Admin Login</h3>
        <p class="text-muted mb-4">Click the button below to complete your secure sign-in to the CIRRMS Admin Portal.</p>
        
        <form action="{{ url_for('verify_tap', username=username, token=token) }}" method="POST">
            <button type="submit" class="btn text-white w-100 py-2 fw-bold" style="background-color: #1b4332; border-radius: 8px;">
                Complete Login & Access Dashboard
            </button>
        </form>
    </div>
</div>
{% endblock %}
